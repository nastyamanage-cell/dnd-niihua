<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НИИХУА</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Christmas Snowflakes -->
    <div class="snowflakes">
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
        <div class="snowflake">❆</div>
        <div class="snowflake">❄</div>
        <div class="snowflake">❅</div>
    </div>

    <header class="main-menu">
        <div class="menu-container">
            <div class="logo-section">
                <img src="icon.jpg" alt="НИИХУА" class="logo-icon">
                <span class="logo-text">НИИХУА</span>
            </div>
            <nav class="menu-nav">
                <a href="characters.html" class="menu-link">Персонажи</a>
                <a href="index.html#map" class="menu-link">Карта</a>
                <a href="institute.html" class="menu-link">Об институте</a>
            </nav>
        </div>
    </header>
    <section class="screen screen-1">
        <div class="dossier-container">
            <div class="photo-container">
                <div class="photo-wrapper">
                    <img src="first.jpg" alt="НИИХУА" class="building-photo">
                </div>
            </div>
            <div class="text-container">
                <div class="title-wrapper">
                    <span class="title-back">НИИХУА</span>
                    <h1 class="title">Научно Исследовательский Институт Хитроумной Алхимии</h1>
                </div>
                <p class="subtitle">Рождественское приключение хитро<del>жопой</del>-умной компании</p>
            </div>
        </div>
        <div class="scroll-indicator" onclick="scrollToNext()">
            <div class="arrow-down"></div>
        </div>
    </section>
    
    <section class="screen screen-2" id="screen-2">
        <div class="garland">
            <div class="garland-wire"></div>
            <div class="lights">
                <span class="light light-1"></span>
                <span class="light light-2"></span>
                <span class="light light-3"></span>
                <span class="light light-4"></span>
                <span class="light light-5"></span>
                <span class="light light-1"></span>
                <span class="light light-2"></span>
                <span class="light light-3"></span>
                <span class="light light-4"></span>
                <span class="light light-5"></span>
                <span class="light light-1"></span>
                <span class="light light-2"></span>
                <span class="light light-3"></span>
                <span class="light light-4"></span>
                <span class="light light-5"></span>
            </div>
        </div>
        <div class="screen-2-content">
            <h2 class="screen-2-title">С Новым Годом!</h2>
            <p class="screen-2-text" id="text1" data-full-text="Сегодня институт работает в праздничном режиме <strong>катастрофы</strong>."></p>
            <p class="screen-2-text" id="text2" data-full-text="У вашей команды есть три часа, чтобы предотвратить неминуемое."></p>
        </div>
        <div class="scroll-indicator" onclick="scrollToVideo()">
            <div class="arrow-down"></div>
        </div>
    </section>

    <!-- Screen 3: Video -->
    <section class="screen screen-3" id="screen-3">
        <div class="video-container">
            <h2 class="video-title">Приключение начинается...</h2>
            <div class="video-wrapper">
                <iframe id="youtube-player" width="100%" height="100%" 
                    src="https://www.youtube.com/embed/UDsu-WVmAhE?enablejsapi=1" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>

    <!-- Screen 4: Map -->
    <section class="screen screen-4" id="map">
        <div class="map-container">
            <img src="map.jpg" alt="Карта НИИХУА" class="map-image">
        </div>
    </section>
    <script src="script.js?v=2"></script>
</body>
</html>
